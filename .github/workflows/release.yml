name: Build & Publish APK

on:
  push:
    tags:
      - 'v*.*.*'

# Publishing the release for the tag needs write access; nothing else does.
permissions:
  contents: write

jobs:
  build:
    # Pinned: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19, which can shift
    # the preinstalled SDK/JDK. This is the image the pipeline is verified on.
    runs-on: ubuntu-24.04
    steps:
      # Full history: notes are generated from the previous tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # JDK 17: the version this build is verified against locally (AGP 8.7.3 / Kotlin 2.1.0).
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # setup-android's default `packages` is "tools platform-tools", but the
          # `tools` package no longer exists -> `sdkmanager tools` exits 1.
          # "" disables it; the next step installs what the build actually needs.
          packages: ""

      # Nothing else installs the build platform: setup-android only accepts a
      # `packages` input, so api-level/ndk-version/build-tools there are ignored.
      # The app has no native code, so no NDK or CMake is needed.
      - name: Install build platform and build-tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      # Caches the wrapper distribution / dependencies; ./gradlew provides Gradle.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The release APK MUST be signed with the release key. Without a
      # signingConfig AGP silently emits an UNSIGNED apk under the release
      # filename, and a debug-signed apk breaks in-place updates for users.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hermes-mobile.jks"

      - name: Build signed release APK
        env:
          HERMES_KEYSTORE: ${{ runner.temp }}/hermes-mobile.jks
          HERMES_STOREPASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HERMES_KEYPASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$HERMES_STOREPASSWORD" ] && [ -n "$HERMES_KEYPASSWORD" ] || \
            { echo "::error::KEYSTORE_PASSWORD / KEY_PASSWORD secrets are not set"; exit 1; }
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify the APK is release-signed
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk')
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          if "$APKSIGNER" verify --print-certs "$APK" | grep -q "CN=Android Debug"; then
            echo "::error::$APK is debug-signed"; exit 1
          fi

      # The mobile self-updater refuses to install without SHA256SUMS.
      - name: Generate SHA256SUMS
        run: |
          cd app/build/outputs/apk/release
          sha256sum ./*.apk > SHA256SUMS
          cat SHA256SUMS

      # Publish from CI, so no GPG key or passphrase lives on a developer
      # machine. The key is the repo secret GPG_PRIVATE_KEY; the keyring is a
      # temp dir that dies with the job, and Actions masks both values.
      - name: Sign SHA256SUMS
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "::error::GPG_PRIVATE_KEY secret is not set"; exit 1; }
          [ -n "$GPG_PASSPHRASE" ] || { echo "::error::GPG_PASSPHRASE secret is not set"; exit 1; }
          OUT=app/build/outputs/apk/release
          KEY=ABA60904F3954B774F95A09DAA54710F35652638
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Passphrase via stdin: it never appears in argv or the process list.
          printf '%s' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --local-user "$KEY" --armor --detach-sign \
            -o "$OUT/SHA256SUMS.asc" "$OUT/SHA256SUMS"
          gpg --batch --verify "$OUT/SHA256SUMS.asc" "$OUT/SHA256SUMS"
          # Export the public half from the signing key, so the release asset
          # can never disagree with the signature.
          gpg --armor --export "$KEY" > "$OUT/hermes-release-public-key.asc"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          OUT=app/build/outputs/apk/release
          PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]' | grep -vx "$TAG" | head -1 || true)
          {
            if [ -n "$PREV" ]; then printf '## Changes since %s\n\n' "$PREV"; fi
            git log -n 40 --no-merges --pretty=format:'- %s' "${PREV:+$PREV..}$TAG"
            printf '\n\nAndroid client for Hermes Agent. One APK runs on every device (Android 8+).\n\n'
            # shellcheck disable=SC2016  # backticks are markdown, not substitution
            printf '**Install:** download `Hermes-Mobile-%s.apk`, open it, allow "install from unknown sources" once.\n\n' "$TAG"
            printf '**Verify:**\n```bash\n'
            printf 'sha256sum -c SHA256SUMS --ignore-missing\n'
            printf 'gpg --import hermes-release-public-key.asc\n'
            printf 'gpg --verify SHA256SUMS.asc SHA256SUMS\n```\n'
          } > NOTES.md
          gh release create "$TAG" \
            "$OUT/Hermes-Mobile-$TAG.apk" "$OUT/SHA256SUMS" "$OUT/SHA256SUMS.asc" \
            "$OUT/hermes-release-public-key.asc" \
            --title "$TAG" --notes-file NOTES.md
          echo "::notice::published $TAG with the signed APK"
