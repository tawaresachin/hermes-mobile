org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m
# Termux pad is 8 GB with heavy swap pressure: never leave a 2 GB daemon
# resident after a build. Exit the daemon when the build finishes and
# keep no idle daemons around between invocations.
org.gradle.daemon=false
org.gradle.jvm.stats=false
org.gradle.parallel=false
android.useAndroidX=true
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
