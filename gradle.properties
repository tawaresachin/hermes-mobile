# -Xmx1g OOM'd release lint (lintVitalRelease: "Java heap space" while
# analyzing MarkupEditor.kt), which fails assembleRelease outright.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
# Never leave a large daemon resident after a build: exit the daemon when
# the build finishes and keep no idle daemons between invocations.
org.gradle.daemon=false
org.gradle.jvm.stats=false
org.gradle.parallel=false
android.useAndroidX=true

# Release signing (local machine only — DO NOT commit the keystore or password)
# hermes.keystore=/absolute/path/to/keystore.jks
# hermes.keyPassword=... / hermes.storePassword=...
android.enableAapt2Daemon=false
